function buildP(){const f=fld;$('form').innerHTML=`<div class='card'><h3>Exporter</h3>${f('name','Company Name')}${f('addr','Address','a')}${f('phone','Cell / Phone')}${f('email','Email')}${f('gst','GST Number')}${f('iec','IEC Number')}</div><div class='card'><h3>Logo, Seal &amp; Signature</h3><label>Upload Logo</label><input type='file' accept='image/*' data-logo='1'><button class='rm' data-clrlogo='1'>Clear</button><label>Upload Company Seal</label><input type='file' accept='image/*' data-up='seal'><button class='rm' data-clr='seal'>Clear</button><label>Upload My Signature</label><input type='file' accept='image/*' data-up='sigimg'><button class='rm' data-clr='sigimg'>Clear</button>${f('sig','Authorized Signatory')}${f('desig','Designation')}</div><div class='card'><h3>Consignee / Importer</h3>${f('b_name','Company Name')}${f('b_addr','Address & Country','a')}${f('b_phone','Phone')}${f('notify','Notify Party / Ship To','a')}</div><div class='card'><h3>Shipment Details</h3>${f('no','Packing List No.')}${f('date','Date','date')}${f('ref','Other Reference')}${f('prec','Pre-Carriage by')}${f('plr','Place of Received by Pre-Carrier')}${f('vessel','Vessel / Flight No.')}${f('pol','Port of Loading')}${f('pod','Port of Discharge')}${f('origin','Country of Origin of Goods')}${f('dest','Final Destination')}</div><div class='card'><h3>Terms of Delivery &amp; Payment</h3>${f('delt','Delivery Term')}${f('terms','Terms (e.g. CIF New York Port USA)')}${f('payt','Payment Term')}</div><div class='card'><h3>Goods</h3><div id='its'></div><button id='add'>Add Item</button></div><div class='card'><h3>Bottom Note</h3>${f('foot','Note','a')}</div>`;document.querySelectorAll('[data-k]').forEach(e=>{e.value=D.P[e.dataset.k]??'';e.oninput=()=>{D.P[e.dataset.k]=e.value;draw()}});document.querySelectorAll('[data-up]').forEach(e=>e.onchange=()=>rd(e.files[0],v=>{D.P[e.dataset.up]=v;draw()}));document.querySelectorAll('[data-clr]').forEach(b=>b.onclick=()=>{D.P[b.dataset.clr]='';draw()});document.querySelectorAll('[data-logo]').forEach(e=>e.onchange=()=>rd(e.files[0],v=>{logo=v;draw()}));document.querySelectorAll('[data-clrlogo]').forEach(b=>b.onclick=()=>{logo='';draw()});$('add').onclick=()=>{D.P.items.push(newP());itsP();draw()};itsP()}
function itsP(){const n=(i,k,t,v)=>`<div><label>${t}</label><input type='number' data-i='${i}' data-f='${k}' value='${v}'></div>`,s=(i,k,t,v)=>`<div><label>${t}</label><input data-i='${i}' data-f='${k}' value="${E(v).replace(/"/g,'&quot;')}"></div>`;$('its').innerHTML=D.P.items.map((x,i)=>`<div class='it'>${s(i,'kind','Kind Packing',x.kind)}${s(i,'hs','HS Code',x.hs)}${s(i,'desc','Description of Goods',x.desc)}<div class='r2'>${s(i,'unit','Unit',x.unit)}${n(i,'qty','Quantity (Box/PCS)',x.qty)}</div><div class='r2'>${n(i,'nw','Net Weight (KG)',x.nw)}${n(i,'gw','Gross Weight (KG)',x.gw)}</div><button class='rm' data-del='${i}'>Remove</button></div>`).join('');$('its').querySelectorAll('[data-f]').forEach(e=>{const h=()=>{D.P.items[e.dataset.i][e.dataset.f]=e.type=='number'?+e.value:e.value;draw()};e.oninput=h});$('its').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{D.P.items.splice(b.dataset.del,1);itsP();draw()})}
function drawP(){const d=D.P,it=d.items,S=f=>it.reduce((a,x)=>a+(+f(x)||0),0),N=n=>(+n||0).toLocaleString('en-IN',{maximumFractionDigits:2}),F=s=>s?new Date(s+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}):'';let a=0;
const rows=it.map((x,i)=>{const s=a+1;a+=+x.qty||0;return `<tr class='itm'><td class='ct'>${i+1}</td><td>${E(x.kind)}</td><td>${E(x.hs)}</td><td>${E(x.desc)}</td><td class='ct'>${s} to ${a}</td><td class='ct'>${E(x.unit)}</td><td class='ct'>${N(x.qty)}</td><td class='ct'>${N(x.nw)}</td><td class='ct'>${N(x.gw)}</td></tr>`}).join('')||`<tr><td colspan='9'>No items added</td></tr>`;
$('doc').innerHTML=`${logo?`<img src='${logo}' style='max-height:60px;display:block;margin:0 auto 8px'>`:''}<div class='pl'><div class='tt'>PACKING LIST</div>
<div class='g'><div><div class='r'><b>EXPORTER</b><br><b>${V(d.name)}</b><br>${B(d.addr)}<br>Cell ${E(d.phone)}<br>${E(d.email)}</div></div><div><div class='r h2'><div><b>Packing list No. &amp; Date</b><br>${E(d.no)} &nbsp; ${F(d.date)}</div><div class='pg'><b>Page</b><br>1 of 1</div></div><div class='r'>GST Number: ${V(d.gst)}</div><div class='r'>IEC Number: ${V(d.iec)}</div><div class='r'><b>Other Reference:</b> &nbsp; ${V(d.ref)}</div><div class='r'><b>Notify Party / Ship To</b><br>${d.notify?B(d.notify):'--'}</div></div></div>
<div class='g'><div><div class='r'><b>CONSIGNEE/IMPORTER:</b><br><b>${V(d.b_name)}</b><br>${B(d.b_addr)}<br>${E(d.b_phone)}</div></div><div><div class='r h2 e'><div class='ct'><b>Country of origin of goods</b><br>${V(d.origin)}</div><div class='ct pg'><b>Final Destination</b><br>${V(d.dest)}</div></div></div></div>
<div class='g'><div class='q'><div><b>Pre-Carriage by</b><br>${V(d.prec)}</div><div><b>Place of Received by Pre-Carrier</b><br>${V(d.plr)}</div><div><b>Vessel/Flight No.</b><br>${V(d.vessel)}</div><div><b>Port of Loading</b><br>${V(d.pol)}</div><div><b>Port of Discharge</b><br>${V(d.pod)}</div><div><b>Final Destination</b><br>${V(d.dest)}</div></div><div><div class='r'>Terms of Delivery and Payment:<br><b>Delivery Term :</b> ${E(d.delt)}<br>${E(d.terms)}<br><b>Payment Term :</b> ${E(d.payt)}</div></div></div>
<table><tr><th>S. No</th><th>Kind Packing</th><th>HS Code</th><th>Description of Goods</th><th>Box No</th><th>UNIT</th><th>Quantity<br>Box/PCS</th><th>Net Weight<br>(KG)</th><th>Gross Weight<br>(KG)</th></tr>${rows}<tr class='tl'><td colspan='6'><b>TOTAL</b></td><td class='ct'><b>${N(S(x=>x.qty))}</b></td><td class='ct'><b>${N(S(x=>x.nw))}</b></td><td class='ct'><b>${N(S(x=>x.gw))}</b></td></tr></table>
<div class='g sg2'><div></div><div><div class='r'>Exporter Signature</div><div style='padding:4px 8px;min-height:70px'>${d.seal?`<img src='${d.seal}' style='max-height:60px'> `:''}${d.sigimg?`<img src='${d.sigimg}' style='max-height:60px'>`:''}<br><b>${E(d.sig)}</b>${d.sig&&d.desig?', ':''}${E(d.desig)}</div></div></div>
<div class='r nt'>${B(d.foot)}</div></div>`}
function rd(f,cb){if(!f)return;const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f)}
$('lg').onchange=e=>rd(e.target.files[0],v=>{logo=v;draw()});
function go(k){cur=k;$('tq').className=k=='Q'?'':'off';$('ti').className=k=='I'?'':'off';$('tp').className=k=='P'?'':'off';build();draw()}
